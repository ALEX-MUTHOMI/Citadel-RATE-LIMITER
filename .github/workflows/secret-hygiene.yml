name: Secret hygiene

on:
  push:
    branches: [DEVELOPMENT, STAGING, MAIN]
  pull_request:

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan repository for leaked secrets
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/src:ro" \
            ghcr.io/gitleaks/gitleaks:v8.24.3 \
            detect --source=/src --config=/src/.gitleaks.toml --verbose --redact
