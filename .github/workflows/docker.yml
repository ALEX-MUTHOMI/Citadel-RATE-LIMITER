name: Docker image

on:
  push:
    branches: [DEVELOPMENT, STAGING, MAIN]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'MAIN' && 'production' || github.ref_name == 'STAGING' && 'staging' || 'development' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          USERNAME=$(printf '%s' "$DOCKERHUB_USERNAME" | tr -d '\r\n' | sed -e 's/^["'\'']//' -e 's/["'\'']$//')
          TOKEN=$(printf '%s' "$DOCKERHUB_TOKEN" | tr -d '\r\n' | sed -e 's/^["'\'']//' -e 's/["'\'']$//')
          if [ -z "$USERNAME" ] || [ -z "$TOKEN" ]; then
            echo "DOCKERHUB_USERNAME or DOCKERHUB_TOKEN is empty after trimming."
            echo "Use GitHub environment variable DOCKERHUB_USERNAME and repository secret DOCKERHUB_TOKEN."
            exit 1
          fi
          printf '%s' "$TOKEN" | docker login -u "$USERNAME" --password-stdin

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ vars.IMAGE_NAME }}:${{ github.ref_name }}
            ${{ vars.IMAGE_NAME }}:${{ github.sha }}
